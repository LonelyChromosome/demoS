name: Restore pinned BPA 1.6 source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check whether source is already restored
        id: state
        run: |
          if test -f reference/source-manifest.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.state.outputs.needed == 'true'
        with:
          repository: LonelyChromosome/DemoF3
          ref: 16f7ee232ad2b74699cf960f33c87c8caaadecc3
          path: upstream-android
      - name: Restore exact committed Flutter source and Android reference assets
        if: steps.state.outputs.needed == 'true'
        run: |
          set -euo pipefail
          pin=16f7ee232ad2b74699cf960f33c87c8caaadecc3
          git -C upstream-android archive "$pin" lib assets shaders test pubspec.yaml pubspec.lock analysis_options.yaml | tar -x
          mkdir -p reference/android ios/WidgetAssets
          git -C upstream-android archive "$pin" android/app/src/main/kotlin android/app/src/main/res/layout android/app/src/main/res/drawable | tar -x -C reference/android
          cp -R upstream-android/android/app/src/main/assets/widget2_themes ios/WidgetAssets/
          cp upstream-android/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ios/WidgetAssets/AndroidLauncher.png
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          pin='16f7ee232ad2b74699cf960f33c87c8caaadecc3'
          names=subprocess.check_output(['git','-C','upstream-android','ls-tree','-r','--name-only',pin,'lib','assets','shaders','test','pubspec.yaml','pubspec.lock','analysis_options.yaml'],text=True).splitlines()
          manifest={'repository':'LonelyChromosome/DemoF3','commit':pin,'version':'1.6.0+51','files':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}}
          Path('reference/source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib assets shaders test pubspec.yaml pubspec.lock analysis_options.yaml reference ios/WidgetAssets
          git commit -m "Restore exact BPA Android 1.6 source and native widget assets"
          git push origin HEAD:main
