name: BPA Scriptable app and original Flutter UI
on:
  push:
    branches: [main, feature/scriptable-android-parity]
    paths: [lib/**, assets/**, shaders/**, pubspec.*, web/**, scriptable/**, tool/**, test/scriptable/**, .github/workflows/scriptable.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scriptable-app
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify original data contracts and Scriptable transport
        run: |
          bash tool/test_core.sh
          flutter test --dart-define=BPA_SCRIPTABLE=true test/scriptable_update_manifest_test.dart
          python3 scriptable/build.py
          TZ=Asia/Ho_Chi_Minh node --test test/scriptable/*.test.js
      - name: Build original app UI for Scriptable WebView
        run: python3 tool/build_scriptable_web.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Compile the real Clock Shortcut on Linux
        run: |
          cherri_dir="$RUNNER_TEMP/bpa-cherri-src"
          git clone https://github.com/electrikmilk/cherri.git "$cherri_dir"
          git -C "$cherri_dir" checkout a66db15b7f247f3121726c2a2b72becfeef3d96b
          (cd "$cherri_dir" && go build -o "$RUNNER_TEMP/bpa-cherri" .)
          mkdir -p build/shortcuts
          cp scriptable/shortcuts/BPA-Alarm.cherri build/shortcuts/
          "$RUNNER_TEMP/bpa-cherri" build/shortcuts/BPA-Alarm.cherri --skip-sign --derive-uuids
          # External signing is paused until the user explicitly authorizes Shortcuty.
      - name: Keep Shortcut compiler and source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BPA-Shortcut-compiler-QA
          path: |
            ${{ runner.temp }}/bpa-cherri
            build/shortcuts
          retention-days: 1
      - name: Include Scriptable host and original widget assets
        run: |
          mkdir -p build/web/scriptable
          cp scriptable/BPA.js scriptable/BPA.scriptable scriptable/BPA-Scriptable-Sync.js scriptable/README.md build/web/scriptable/
          cp -R ios/WidgetAssets build/web/widget-assets
          python3 tool/build_widget_assets.py
      - name: Exercise local Flutter loader in Chromium
        env:
          BPA_QA_NODE_MODULES: ${{ runner.temp }}/bpa-web-qa/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/bpa-web-qa" playwright
          node tool/test_local_web.cjs
      - name: Exercise local loader and original card HTML in WebKit
        env:
          BPA_QA_NODE_MODULES: ${{ runner.temp }}/bpa-web-qa/node_modules
          BPA_QA_ENGINE: webkit
        run: |
          "$RUNNER_TEMP/bpa-web-qa/node_modules/.bin/playwright" install --with-deps webkit
          node tool/test_local_web.cjs
      - name: Keep loader diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BPA-local-loader-QA
          path: build/qa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: BPA-Scriptable-app
          path: build/web
          retention-days: 14
      - name: Open isolated compiled-resource branch
        uses: actions/checkout@v5
        with:
          ref: scriptable-web
          path: compiled-resources
      - name: Publish files for the local Scriptable installer
        run: |
          git -C compiled-resources rm -rf .
          cp -R build/web/. compiled-resources/
          python3 tool/build_local_package.py compiled-resources
          git -C compiled-resources config user.name github-actions[bot]
          git -C compiled-resources config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C compiled-resources add .
          if ! git -C compiled-resources diff --cached --quiet; then
            git -C compiled-resources commit -m "Compile BPA resources from $GITHUB_SHA"
            git -C compiled-resources push origin HEAD:scriptable-web
          fi
