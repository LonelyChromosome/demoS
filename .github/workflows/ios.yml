name: BPA 1.6 iPhone build
on:
  push:
    branches: [main, feature/ios-bpa-1.6]
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_SUPPRESS_ANALYTICS: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure standard Flutter iOS host and native extension
        run: |
          gem install xcodeproj --no-document --user-install
          bash tool/generate_ios.sh
      - run: python3 tool/check_source_reuse.py
      - run: flutter pub get
      - name: Verify preserved BPA core contracts
        run: bash tool/test_core.sh
      - name: Compile app and three-widget extension
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --build-number=51 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Package unsigned build for inspection only
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qr BPA-1.6-iPhone-UNSIGNED.ipa Payload
      - name: Save native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BPA-iOS-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-build.log
            ios/Runner.xcodeproj/project.pbxproj
            ios/Podfile
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: BPA-1.6-iPhone-unsigned-${{ github.sha }}
          path: dist/BPA-1.6-iPhone-UNSIGNED.ipa
          retention-days: 14
