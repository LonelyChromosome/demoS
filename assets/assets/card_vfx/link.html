<script>
window.paSetState=(state,name)=>{

 else window.paLinkState(state,name);
};
window.paSetMode=(deleting,state,name)=>{

  const now=performance.now(),time=(now-window.paVfxOrigin)/1000,pose=window.paCardPose||{yaw:540,y:0};
  window.paUnlinkEnter=now;
  window.paUnlinkOffset={yaw:pose.yaw-(540+Math.sin(time*1.3)*8),y:pose.y-(Math.sin(time*1.7)*9-5)};

  root.querySelector('.pa-caption').style.display='';root.querySelector('.pa-front .pa-state').firstChild.textContent='Authorizing';

  root.querySelector('.pa-phase').style.color='';root.querySelector('.pa-flash').style.background='';
 }

};
