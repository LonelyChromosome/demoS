<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{--blue:#1747b5;--ink:#102b73;--muted:#7180a0;--border:#e8edf7;--top-gap:12.5dvh}*{box-sizing:border-box}:root{--surface:white;--alt:#f3f6fc;--page-start:#f9fbff;--page-end:#f2f6ff}body{margin:0;color:var(--ink);font:15px Roboto,-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(var(--page-start),var(--page-end));height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid var(--blue)}.hidden{display:none!important}#login{height:100%;padding:max(32px,var(--top-gap)) 32px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.mark{display:grid;place-items:center;width:62px;height:62px;border-radius:12px;background:#ffffff59;border:5px solid var(--blue);color:var(--blue)}.mark svg{width:36px;height:36px;stroke-width:3}h1{font-size:28px;font-weight:900;margin:22px 0 14px}#login p{color:var(--muted);line-height:1.55}#login button{background:var(--blue);color:white;width:100%;border-radius:14px;min-height:62px;margin:23px 0;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800}.ms{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}.ms i:nth-child(1){background:#f35325}.ms i:nth-child(2){background:#81bc06}.ms i:nth-child(3){background:#05a6f0}.ms i:nth-child(4){background:#ffba08}.credit{position:absolute;bottom:24px;font-size:11px;color:var(--muted)}#schedule{height:100%;padding:max(var(--top-gap),env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.heading h1{margin:0}.iconbutton{width:40px;height:40px;display:grid;place-items:center;background:#f3f6fc;border-radius:14px;color:var(--blue)}svg{w </style></head><body><div id="ambient"></div>
<section id="login"><div class="mark"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h1 id="loginHeading">Chào mừng bạn!</h1><p>Kết nối với QLĐT để xem lịch học và lịch thi của bạn</p><button id="loginButton"><span class="ms"><i></i><i></i><i></i><i></i></span><span id="loginCaption">Đăng nhập QLĐT<br>(Microsoft)</span></button><p style="font-size:12px">Dữ liệu chỉ lưu cục bộ trên thiết bị của bạn</p><button id="loginModules">Phần mở rộng</button><div id="loginStatus" role="status"></div><div class="credit">Better Phenikaa App • cooc 1.0 base</div></section>
<section id="schedule" class="hidden"><header class="heading"><h1>Lịch học</h1><button id="calendar" class="iconbutton" aria-label="Chọn ngày"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m3 0h2m-7 3h2m3 0h2"/></svg></button></header><div class="tabs"><button id="day" class="active">Theo ngày</button><button id="week">Theo tuần</button></div><nav class="navigate"><button id="previous" aria-label="Trước">❮</button><button id="dateLabel"></button><button id="next" aria-label="Sau">❯</button></nav><div id="status" role="status"></div><div id="rows"></div><div id="name"></div><button id="menuButton" aria-label="Mở bảng điều khiển"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="14" y="2" width="8" height="8" rx="2"/><rect x="2" y="14" width="8" height="8" rx="2"/><rect x="14" y="14" width="8" height="8" rx="2"/></svg></button><nav id="actions" class="hidden"><button id="today">Hôm nay</button><button id="sync">Đồng bộ</button><button id="exams">Lịch thi</button><button id="modulesButton">Phần mở rộng</button><button id="account">Tài khoản</button></nav></section>
<dialog id="modulePanel"><h2>Phần mở rộng</h2><div id="moduleList"></div><form method="dialog"><button>Đóng</button></form></dialog><dialog id="picker"><form method="dialog"><strong>Chọn ngày</strong><input id="pickedDate" type="date" required><button value="cancel" formnovalidate>Đóng</button><button value="choose">Chọn</button></form></dialog>
<script>
(()=>{
function fit(){document.documentElement.style.setProperty('--top-gap',Math.ceil(window.innerHeight/8)+'px');}fit();window.addEventListener('resize',fit);
let state={snapshot:null,busy:false,message:'',error:false},date=new Date(),weekly=false,examMode=false,queue=[],wait=null;
const $=id=>document.getElementById(id),dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const same=(a,b)=>dayKey(new Date(a))===dayKey(b),time=d=>new Date(d).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});
const monday=d=>{const r=new Date(d);r.setDate(r.getDate()-((r.getDay()+6)%7));return r;};
$('menuButton').onclick=()=>$('actions').classList.toggle('hidden');
function emit(action,extra={}){$('actions').classList.add('hidden');if((action==='sync'||action.startsWith('module-'))&&state.busy)return;const command={action,date:dayKey(date),...extra};if(parentNonce)window.parent.postMessage({bpa:parentNonce,command},'*');else queue.push(command);if(wait){const cb=wait;wait=null;cb(queue.splice(0));}if(action.startsWith('module-')){state.busy=true;state.message='Đang xử lý…';render();}if(action==='sync'){state.busy=true;state.message='Đang kết nối QLĐT…';render();}}
function icon(kind){const paths={room:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',time:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',book:'<path d="M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2ZM12 6v15"/>'};return `<svg viewBox="0 0 24 24">${paths[kind]}</svg>`;}
function meta(kind,text){const p=document.createElement('div');p.className='meta '+kind;p.innerHTML=icon(kind);const t=document.createElement('span');t.textContent=text;p.append(t);return p;}
function course(row,index,compact=false){const c=document.createElement('article');c.className=compact?'weekcourse':'card';if(!compact){const stripe=document.createElement('div');stripe.className='stripe';stripe.style.background=['#4a89ff','#49b5a9','#9174cb','#e5a34d'][index%4];const start=document.createElement('div');start.className='start';start.textContent=time(row.startAt);c.append(stripe,start);}const details=document.createElement('div');details.className=compact?'':'details';if(state.alarms&&!row.isExam&&!compact){const alarm=document.createElement('button');alarm.className='alarm-button';alarm.setAttribute('aria-label','Báo thức '+row.subjectName);alarm.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M4 3l-2 3m18-3 2 3"/></svg>';alarm.onclick=()=>emit('module-open',{id:'alarms',rowId:row.id});details.append(alarm);}const title=document.createElement('div');title.className='subject';title.textContent=row.subjectName;details.append(title);if(row.room)details.append(meta('room',row.room));details.append(meta('time',`${time(row.startAt)} - ${time(row.endAt)}`));if(row.periodStart!=null&&row.periodEnd!=null)details.append(meta('book',`Tiết ${row.periodStart} - ${row.periodEnd}`));c.append(details);return c;}
function render(){applyTheme();renderModules();document.querySelector('.heading h1').textContent=examMode?'Lịch thi':'Lịch học';$('exams').textContent=examMode?'Lịch học':'Lịch thi';const snapshot=state.snapshot,records=(snapshot?.records||[]).filter(r=>examMode?!!r.isExam:!r.isExam).slice().sort((a,b)=>new Date(a.startAt)-new Date(b.startAt));$('login').classList.toggle('hidden',!!snapshot);$('schedule').classList.toggle('hidden',!snapshot);$('loginHeading').textContent=state.authenticated?'Đã kết nối QLĐT':'Chào mừng bạn!';$('loginCaption').textContent=state.authenticated?(state.busy?'Đang lấy lịch…':'Thử đồng bộ lại'):'Đăng nhập QLĐT (Microsoft)';$('loginButton').disabled=state.busy;$('sync').disabled=state.busy;$('loginStatus').textContent=state.message;$('status').textContent=state.message|| (snapshot?`Đồng bộ: ${new Date(snapshot.syncedAt).toLocaleString('vi-VN')}`:'');$('status').classList.toggle('error',state.error);$('name').textContent=state.displayName||snapshot?.displayName||'';$('day').classList.toggle('active',!weekly);$('week').classList.toggle('active',weekly);const rows=$('rows');rows.replaceChildren();if(!snapshot)return;
if(weekly){const start=monday(date),end=new Date(start);end.setDate(end.getDate()+6);$('dateLabel').textContent=`${start.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})} – ${end.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})}`;for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const items=records.filter(r=>same(r.startAt,d)),row=document.createElement('div');row.className='weekrow';const label=document.createElement('div');label.className='weekday';const b=document.createElement('b');b.textContent=i===6?'Chủ nhật':`Thứ ${i+2}`;const s=document.createElement('span');s.textContent=d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});label.append(b,s);if(items.length){const count=document.createElement('small');count.textContent=`${items.length} buổi`;label.append(count);}const content=document.createElement('div');content.className='weekcards';if(items.length)items.forEach((r,j)=>content.append(course(r,j,true)));else{const empty=document.createElement('div');empty.className='weekempty';empty.textContent='Không có lịch học';content.append(empty);}row.append(label,content);rows.append(row);}}
else{$('dateLabel').textContent=date.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});const items=records.filter(r=>same(r.startAt,date));if(items.length)items.forEach((r,i)=>rows.append(course(r,i)));else{const empty=document.createElement('div');empty.className='empty';empty.textContent='Không có lịch học\nVuốt sang ngày khác, bấm ngày hoặc biểu tượng lịch để chọn nhanh.';rows.append(empty);}}}
function shift(n){date.setDate(date.getDate()+n*(weekly?7:1));render();}
$('previous').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('day').onclick=()=>{weekly=false;render();};$('week').onclick=()=>{weekly=true;render();};$('today').onclick=()=>{$('actions').classList.add('hidden');date=new Date();render();};$('sync').onclick=$('loginButton').onclick=()=>emit('sync');$('account').onclick=()=>emit('account');
function pick(){$('pickedDate').value=dayKey(date);$('picker').showModal();}$('calendar').onclick=$('dateLabel').onclick=pick;$('picker').addEventListener('close',()=>{if($('picker').returnValue==='choose'&&$('pickedDate').value){date=new Date($('pickedDate').value+'T12:00:00');render();}});
let touch=null;$('rows').addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('rows').addEventListener('touchend',e=>{if(!touch||weekly)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)shift(dx<0?1:-1);touch=null;},{passive:true});
function renderModules(){const list=$('moduleList');list.replaceChildren();if(!state.modules?.length){list.textContent='Đang mở danh sách…';return;}for(const item of state.modules){const card=document.createElement('article');card.className='module-card';const h=document.createElement('h3');h.textContent=item.title;const size=document.createElement('small');size.textContent=(item.size/1048576).toFixed(2)+' MB'+(item.installed?' • Đã cài':'');card.append(h,size,document.createElement('br'));for(const [label,action]of item.installed?[['Mở','module-open'],[item.current?'Cài lại':'Cập nhật','module-install'],['Gỡ','module-remove']]:[['Tải và cài','module-install']]){const b=document.createElement('button');b.textContent=label;b.disabled=state.busy;b.onclick=()=>emit(action,{id:item.id});card.append(b);}list.append(card);}}
function applyTheme(){const t=state.theme||{},css=n=>typeof n==='number'?'#'+(n>>>0).toString(16).padStart(8,'0').slice(2):null;for(const [key,field]of Object.entries({'--blue':'primary','--ink':'textPrimary','--muted':'textSecondary','--border':'border','--surface':'card','--alt':'cardAlt','--page-start':'pageStart','--page-end':'pageEnd'})){const c=css(t[field]);if(c)document.documentElement.style.setProperty(key,c);else document.documentElement.style.removeProperty(key);}document.body.classList.toggle('premium',t.theme==='tien_mon_premium');}
const mediaChunks={},mediaURLs={};async function media(value){const {kind}=value;if(value.start){mediaChunks[kind]=[];return;}if(value.chunk){const text=atob(value.chunk),bytes=new Uint8Array(text.length);for(let i=0;i<text.length;i++)bytes[i]=text.charCodeAt(i);mediaChunks[kind]?.push(bytes);return;}if(value.end){const parts=mediaChunks[kind]||[];delete mediaChunks[kind];const old=mediaURLs[kind];if(!parts.length){if(kind==='background'){$('ambient').style.backgroundImage='none';document.body.classList.remove('has-background');}else {document.body.style.fontFamily='';if(currentFont)document.fonts.delete(currentFont);currentFont=null;}if(old)URL.revokeObjectURL(old);delete mediaURLs[kind];return;}const url=URL.createObjectURL(new Blob(parts,{type:value.mime||mediaMime[kind]}));mediaURLs[kind]=url;if(kind==='background'){$('ambient').style.backgroundImage='url('+url+')';document.body.classList.add('has-background');}else{const face=new FontFace('BPACustom',`url(${url})`);await face.load();if(currentFont)document.fonts.delete(currentFont);currentFont=face;document.fonts.add(face);document.body.style.fontFamily='BPACustom,Roboto,sans-serif';}if(old)URL.revokeObjectURL(old);}}
let currentFont=null;const mediaMime={};const receiveMedia=value=>{if(value.start)mediaMime[value.kind]=value.mime;media(value).catch(e=>{$('status').textContent=String(e);});};
$('modulesButton').onclick=$('loginModules').onclick=()=>{emit('modules');$('modulePanel').showModal();};$('exams').onclick=()=>{examMode=!examMode;$('actions').classList.add('hidden');render();};document.addEventListener('visibilitychange',()=>document.body.classList.toggle('paused',document.hidden));
const parentNonce=window.__BPA_PARENT_NONCE__||null;
window.addEventListener('message',event=>{if(parentNonce&&event.source===window.parent&&event.data?.bpa===parentNonce&&event.data.media){receiveMedia(event.data.media);}else if(parentNonce&&event.source===window.parent&&event.data?.bpa===parentNonce&&event.data.state){state={...state,...event.data.state};render();}});
window.bpaBase={media:receiveMedia,drain(){return JSON.stringify(queue.splice(0));},set(value){state={...state,...value};render();},poll(done){if(queue.length){done(queue.splice(0));return;}wait=done;},stop(){if(wait){const cb=wait;wait=null;cb([]);}},state:()=>state};render();
})();
</script></body></html>
